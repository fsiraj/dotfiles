config-version = 2
start-at-login = true
auto-reload-config = true
default-root-container-layout = 'tiles'
accordion-padding = 32

[gaps]
    inner.horizontal = 16
    inner.vertical =   16
    outer.left =       16
    outer.bottom =     16
    outer.top =        8
    outer.right =      16


[mode.main.binding]
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-ctrl-h = 'move left'
    alt-ctrl-j = 'move down'
    alt-ctrl-k = 'move up'
    alt-ctrl-l = 'move right'

    alt-ctrl-left  = 'join-with left'
    alt-ctrl-down  = 'join-with down'
    alt-ctrl-up    = 'join-with up'
    alt-ctrl-right = 'join-with right'

    alt-r = 'flatten-workspace-tree'
    alt-f = 'fullscreen'
    alt-ctrl-f = 'layout floating tiling'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'

    alt-ctrl-1 = 'move-node-to-workspace --focus-follows-window 1'
    alt-ctrl-2 = 'move-node-to-workspace --focus-follows-window 2'
    alt-ctrl-3 = 'move-node-to-workspace --focus-follows-window 3'
    alt-ctrl-4 = 'move-node-to-workspace --focus-follows-window 4'
    alt-ctrl-5 = 'move-node-to-workspace --focus-follows-window 5'

    alt-tab = 'workspace-back-and-forth'
    alt-ctrl-tab = 'move-workspace-to-monitor --wrap-around next'

    cmd-h = []
    cmd-alt-h = []

[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.systemsettings'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.vorssaint.utils'
    run = 'layout floating'
